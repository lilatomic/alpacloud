[GLOBAL]
pants_version = "2.23.0dev2"
backend_packages = [
	"pants.backend.python",
	"pants.backend.experimental.python",
	"pants.backend.experimental.python.lint.ruff.format",
	"pants.backend.experimental.python.lint.ruff.check",
	"pants.backend.python.lint.isort",
	"pants.backend.python.lint.flake8",
	"pants.backend.python.lint.pylint",
	"pants.backend.python.typecheck.mypy",
	"pants.backend.build_files.fmt.ruff",
	"pants.backend.docker",
	"pants.backend.docker.lint.hadolint",
]

[source]
root_patterns = [
	"/ansible_collections",
	"/tools",
	"/",
]

[python]
enable_resolves = true
default_resolve = "tools"
interpreter_constraints = [">=3.10"]

[python.resolves]
"mypy" = "cicd/mypy.lock"
"tools" = "cicd/tools.lock"
"ansible.lilatomic.azcli" = "cicd/ansible.lilatomic.azcli.lock"
"ansible.lilatomic.api" = "cicd/ansible.lilatomic.api.lock"

[pylint]
config = ".pylintrc"

[flake8]
config = ".flake8"

[test]
use_coverage = true

[coverage-py]
report = ["xml", "html"]

[mypy]
install_from_resolve = "mypy"

[anonymous-telemetry]
enabled = true
repo_id = "aa6f686d-ffa7-35a8-99c9-37a1a61e8f67"
